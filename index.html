<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>MixControl - Hải Tân JSC</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/@tabler/icons-webfont@3.31.0/dist/tabler-icons.min.css">
<style>
*{box-sizing:border-box}
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:16px;color:#222}
.app-wrap{max-width:920px;margin:0 auto}
.brand-bar{display:flex;align-items:center;gap:14px;padding:14px 18px;background:#fff;border:1px solid #e0e0e0;border-radius:12px;margin-bottom:1rem}
.brand-logo{width:56px;height:48px;display:flex;align-items:center;justify-content:center;flex-shrink:0;background:#fff;border-radius:8px;padding:4px;border:1px solid #eee}
.brand-logo img{width:100%;height:100%;object-fit:contain}
.brand-text{flex:1}
.brand-text h1{font-size:18px;font-weight:600;margin:0}
.brand-text p{font-size:12px;color:#777;margin:1px 0 0}
.conn-status{font-size:12px;padding:4px 10px;border-radius:10px;display:inline-flex;align-items:center;gap:6px;flex-shrink:0}
.conn-status.ok{background:#e8f8ef;color:#1e8449}
.conn-status.err{background:#fde8e8;color:#c0392b}
.conn-status.loading{background:#f0f0f0;color:#777}
.spinner{display:inline-block;width:14px;height:14px;border:2px solid #ddd;border-top-color:#185fa5;border-radius:50%;animation:spin .7s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.tabs-bar{display:flex;gap:6px;margin-bottom:1rem;overflow-x:auto}
.tab-btn{flex-shrink:0;padding:9px 14px;border-radius:8px;font-size:13px;font-weight:500;background:#f0f0f0;color:#555;border:1px solid #ddd;cursor:pointer;display:flex;align-items:center;gap:6px}
.tab-btn.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.tab-btn .count{background:#c0392b;color:#fff;border-radius:10px;padding:0 7px;font-size:11px;min-width:18px;text-align:center}
.step-bar{display:flex;gap:6px;margin-bottom:1.25rem}
.step-pill{flex:1;text-align:center;padding:8px 4px;border-radius:8px;font-size:12px;font-weight:500;background:#f0f0f0;color:#777;border:1px solid #ddd;cursor:pointer}
.step-pill.active{background:#e6f1fb;color:#185fa5;border-color:#185fa5}
.step-pill.done{background:#e8f8ef;color:#1e8449}
.card{background:#fff;border-radius:12px;border:1px solid #e0e0e0;padding:1.25rem;margin-bottom:1rem}
.card h3{font-size:16px;font-weight:600;margin:0 0 12px}
.row{display:flex;gap:10px;align-items:center;margin-bottom:10px;position:relative}
.label{font-size:13px;color:#777;min-width:130px}
select,input[type=text]{flex:1;padding:7px 9px;border:1px solid #ccc;border-radius:6px;font-size:13px}
button{padding:7px 13px;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:13px;background:#fff}
.btn-row{display:flex;gap:10px;margin-top:14px}
button.primary{background:#185fa5;color:#fff;border-color:#185fa5}
button.primary:disabled{background:#aac6e0;border-color:#aac6e0;cursor:not-allowed}
button.success{background:#1e8449;color:#fff;border-color:#1e8449}
button.danger{background:#c0392b;color:#fff;border-color:#c0392b}
.metric-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px;margin:12px 0}
.metric{background:#f7f7f7;border-radius:8px;padding:1rem}
.metric .mlabel{font-size:13px;color:#777;margin-bottom:4px}
.metric .mval{font-size:24px;font-weight:600}
.progress-track{height:10px;background:#eee;border-radius:6px;overflow:hidden;margin:6px 0}
.progress-fill{height:100%;border-radius:6px;transition:width .25s}
.scan-zone{border:1.5px dashed #ccc;border-radius:12px;padding:1.25rem;text-align:center;margin-top:10px}
.scan-zone input{width:100%;text-align:center;font-size:16px;margin-top:8px}
.bag-list{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}
.bag-chip{display:flex;align-items:center;gap:6px;padding:6px 10px;border-radius:8px;font-size:13px;font-weight:500;background:#e8f8ef;color:#1e8449}
.toast-msg{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:#1e8449;color:#fff;padding:10px 20px;border-radius:8px;font-size:14px;font-weight:500;z-index:50;opacity:0;transition:opacity .3s}
.toast-msg.show{opacity:1}
.toast-msg.error{background:#c0392b}
.hist-table{width:100%;font-size:13px;border-collapse:collapse}
.hist-table th{text-align:left;padding:8px 6px;color:#777;border-bottom:1px solid #eee;font-weight:500}
.hist-table td{padding:8px 6px;border-bottom:1px solid #eee}
.badge{display:inline-block;padding:2px 8px;border-radius:8px;font-size:12px;font-weight:500}
.badge.nhua{background:#e6f1fb;color:#185fa5}
.badge.mau{background:#fef3e0;color:#b7770d}
.badge.pending{background:#fef3e0;color:#b7770d}
.badge.approved{background:#e8f8ef;color:#1e8449}
.req-card{border:1px solid #e0e0e0;border-radius:8px;padding:1rem;margin-bottom:10px}
.req-card.pending{border-color:#f0c060;background:#fef9e7}
.cat-table{width:100%;min-width:920px;font-size:13px;border-collapse:collapse}
.cat-table th{text-align:left;padding:8px 6px;color:#777;border-bottom:1px solid #eee;font-weight:500}
.cat-table td{padding:6px;border-bottom:1px solid #eee}
.cat-table input{width:100%;font-size:12px;padding:5px 7px;border:1px solid #ccc;border-radius:5px}
.icon-btn{background:none;border:none;cursor:pointer;color:#999;padding:4px;border-radius:6px}
.icon-btn:hover{background:#f0f0f0;color:#c0392b}
.autocomplete-wrap{flex:1;position:relative}
.autocomplete-list{position:absolute;top:calc(100% + 4px);left:0;right:0;background:#fff;border:1px solid #ccc;border-radius:8px;max-height:220px;overflow-y:auto;z-index:30;box-shadow:0 4px 16px rgba(0,0,0,0.12)}
.autocomplete-item{padding:9px 12px;font-size:13px;cursor:pointer;border-bottom:1px solid #eee}
.autocomplete-item:last-child{border-bottom:none}
.autocomplete-item:hover{background:#f0f0f0}
.autocomplete-empty{padding:9px 12px;font-size:13px;color:#777}
.result-box{padding:1.5rem;text-align:center;border-radius:12px;margin-top:14px}
.result-box.ok{background:#e8f8ef;border:2px solid #1e8449}
.result-box.ng{background:#fde8e8;border:2px solid #c0392b}
.result-icon{font-size:48px;margin-bottom:8px}
.result-icon.ok{color:#1e8449}
.result-icon.ng{color:#c0392b}
.result-label{font-size:24px;font-weight:700;margin-bottom:6px}
.result-label.ok{color:#1e8449}
.result-label.ng{color:#c0392b}
.cl-hist-table{width:100%;font-size:12px;border-collapse:collapse}
.cl-hist-table th{text-align:left;padding:6px;color:#777;border-bottom:1px solid #eee;font-weight:500}
.cl-hist-table td{padding:6px;border-bottom:1px solid #eee}
.cl-badge{display:inline-block;padding:2px 9px;border-radius:10px;font-size:11px;font-weight:700}
.cl-badge.ok{background:#e8f8ef;color:#1e8449}
.cl-badge.ng{background:#fde8e8;color:#c0392b}

.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,0.45);display:flex;align-items:center;justify-content:center;z-index:100;padding:16px}
.modal-box{background:#fff;border-radius:14px;padding:1.5rem;max-width:360px;width:100%;box-shadow:0 10px 40px rgba(0,0,0,0.2)}
.modal-box h3{margin:0 0 6px;font-size:17px}
.modal-box p{font-size:13px;color:#777;margin:0 0 14px}
.modal-box input{width:100%;padding:10px 12px;border:1px solid #ccc;border-radius:8px;font-size:15px;margin-bottom:10px;letter-spacing:2px}
.modal-err{color:#c0392b;font-size:13px;margin:-4px 0 10px;display:none}
.lock-link{font-size:12px;color:#999;cursor:pointer;text-decoration:underline;flex-shrink:0}
.somay-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(80px,1fr));gap:8px;margin:10px 0}
.somay-chip{display:flex;align-items:center;gap:6px;padding:7px 9px;border:1px solid #ddd;border-radius:8px;font-size:13px;cursor:pointer;background:#fafafa}
.somay-chip input{width:15px;height:15px;cursor:pointer}
.somay-chip.checked{background:#e8f8ef;border-color:#1e8449;color:#1e8449;font-weight:600}
</style>
</head>

// Nếu súng quét bắn 1 lần nhưng gửi trùng mã 2-3 lần liên tiếp (VD: "May 01May 01"),
// hàm này tự phát hiện phần lặp nhỏ nhất và trả về đúng 1 bản (VD: "May 01").
// Nếu chuỗi không phải dạng lặp, trả về nguyên văn.
function detectSelfRepeat(str){
  const s = str.trim();
  const n = s.length;
  if(n === 0) return s;
  for(let unitLen = 1; unitLen <= Math.floor(n/2); unitLen++){
    if(n % unitLen !== 0) continue;
    const unit = s.slice(0, unitLen);
    let ok = true;
    for(let i = unitLen; i < n; i += unitLen){
      if(s.slice(i, i+unitLen) !== unit){ ok = false; break; }
    }
    if(ok) return unit;
  }
  return s;
}

// Gắn xử lý cho 1 ô quét mã vạch: nhận Enter NẾU thiết bị gửi, đồng thời tự xử lý
// sau khi ngừng gõ ~350ms (phòng trường hợp scanner/điện thoại không gửi Enter).
// Trả về hàm để có thể gọi thủ công (dùng cho nút "Xác nhận" bấm tay).
function wireScanInput(el, onSubmit){
  if(!el) return null;
  let debounceTimer = null;
  const doTrigger = () => {
    clearTimeout(debounceTimer);
    let val = el.value.trim();
    if(!val) return;
    val = detectSelfRepeat(val);
    el.value = '';
    onSubmit(val);
  };
  el.addEventListener('keydown', e => {
    if(e.key === 'Enter' || e.keyCode === 13 || e.which === 13){
      e.preventDefault();
      doTrigger();
    }
  });
  el.addEventListener('input', () => {
    clearTimeout(debounceTimer);
    const val = el.value.trim();
    if(val){
      debounceTimer = setTimeout(() => {
        if(el.value.trim() === val) doTrigger();
      }, 350);
    }
  });
  return doTrigger;
}
function setConnStatus(state, msg){
  const el = document.getElementById('connStatus');
  el.className = 'conn-status ' + state;
  if(state === 'loading'){ el.innerHTML = '<span class="spinner"></span>' + msg; }
  else if(state === 'ok'){ el.innerHTML = '<i class="ti ti-check"></i>' + msg; }
  else { el.innerHTML = '<i class="ti ti-alert-triangle"></i>' + msg; }
}

async function apiGet(action, extraParams){
  let url = API_URL + '?action=' + action;
  if(extraParams){
    for(const k in extraParams){ url += '&' + k + '=' + encodeURIComponent(extraParams[k]); }
  }
  const res = await fetch(url, {method:'GET'});
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}
async function apiPost(payload){
  const res = await fetch(API_URL, { method:'POST', headers:{'Content-Type':'text/plain;charset=utf-8'}, body: JSON.stringify(payload) });
  if(!res.ok) throw new Error('HTTP ' + res.status);
  return await res.json();
}
function findSp(ten, nhua, mau){ return PRODUCTS.find(p => p.ten === ten) || {ten: String(ten??''), nhua: String(nhua??''), mau: String(mau??''), tyle: 0}; }
function mapRowToRequest(row){
  return { id: row.id, thoigian: row.thoigian, thoigiancap: row.thoigiancap || '', sp: findSp(row.sp_ten, row.sp_nhua, row.sp_mau), may: row.may, soluong: Number(row.soluong) || 0, bao: Number(row.bao) || 0, tui: Number(row.tui) || 0, nhuaKg: Number(row.nhuakg) || 0, mauKg: Number(row.maukg) || 0, baoDu: Number(row.baodu) || 0, baoLeKg: Number(row.baolekg) || 0, tuiDu: Number(row.tuidu) || 0, tuiLeG: Number(row.tuileg) || 0, status: row.status || 'pending', kehoachid: row.kehoachid || '' };
}

// Làm tròn lên nhưng bỏ qua sai số cực nhỏ do floating-point (VD: 25*0.014 = 0.35000000000000003
// khiến Math.ceil tính dư ra 1 đơn vị dù về mặt toán học kết quả là số nguyên tròn).
function safeCeil(n){
  const rounded = Math.round(n * 1e6) / 1e6;
  return Math.ceil(rounded - 1e-9);
}
// Tach 1 tong so ra thanh "so don vi day du" + "1 phan le" (VD: 163kg / 25kg/bao
// = 6 bao day du + 1 bao le 13kg). Neu chia het (khong sai so) thi khong co phan le.
function splitDuLe(total, unit){
  if(!unit || unit <= 0) return {du: 0, le: 0};
  const full = Math.floor(total / unit + 1e-9);
  const remainder = Math.round((total - full * unit) * 1e6) / 1e6;
  if(remainder < 1e-6) return {du: full, le: 0};
  return {du: full, le: remainder};
}
function calcBaoTui(sp, soluong){
  if(!sp || !soluong) return {bao:0, tui:0, nhuaKg:0, mauKg:0, baoDu:0, baoLeKg:0, tuiDu:0, tuiLeG:0};
  const nhuaKg = soluong * 1;
  const mauKg = nhuaKg * sp.tyle;
  const baoKg = sp.baoKg || DEFAULT_BAO_KG;
  const tuiG = sp.tuiG || DEFAULT_TUI_G;
  const baoSplit = splitDuLe(nhuaKg, baoKg);
  const tuiSplit = splitDuLe(mauKg*1000, tuiG);
  const bao = baoSplit.du + (baoSplit.le > 0 ? 1 : 0);
  const tui = tuiSplit.du + (tuiSplit.le > 0 ? 1 : 0);
  return {bao, tui, nhuaKg, mauKg, baoKg, tuiG, baoDu: baoSplit.du, baoLeKg: baoSplit.le, tuiDu: tuiSplit.du, tuiLeG: tuiSplit.le};
}

function renderTronStepBar(){
  const labels = ["1. Gửi yêu cầu", "2. Chờ kho cấp", "3. Bắn mã vạch", "4. Lịch sử"];
  return labels.map((l,i)=>{
    const n=i+1;
    let cls='step-pill';
    if(n===tronState.step) cls+=' active';
    else if(n<tronState.step) cls+=' done';
    return `<div class="${cls}">${l}</div>`;
  }).join('');
}

function renderSpSuggestions(filterText){
  const box = document.getElementById('spSuggestions');
  if(!box) return;
  const q = filterText.trim().toLowerCase();
  const matches = q ? PRODUCTS.filter(p => p.ten.toLowerCase().includes(q)) : PRODUCTS;
  if(matches.length === 0){
    box.innerHTML = '<div class="autocomplete-empty">Không tìm thấy sản phẩm nào</div>';
  } else {
    box.innerHTML = matches.map((p) => {
      const idx = PRODUCTS.indexOf(p);
      return `<div class="autocomplete-item" data-idx="${idx}">${p.ten}</div>`;
    }).join('');
  }
  box.style.display = 'block';
  box.querySelectorAll('.autocomplete-item[data-idx]').forEach(el => {
    el.onmousedown = (e) => {
      e.preventDefault();
      const idx = Number(el.getAttribute('data-idx'));
      tronState.sp = PRODUCTS[idx];
      tronState.spSearchText = PRODUCTS[idx].ten;
      const inp = document.getElementById('spSearch');
      if(inp) inp.value = PRODUCTS[idx].ten;
      box.style.display = 'none';
      renderStep1Summary();
    };
  });
}

function showRequestPicker(statusFilter, title, onPick){
  const list = requests.filter(r => statusFilter.includes(r.status));
  const root = document.getElementById('modalRoot');
  if(list.length === 0){
    showToast('Không có yêu cầu nào phù hợp để chọn', true);
    return;
  }
  root.innerHTML = `
    <div class="modal-overlay" id="pickerOverlay">
      <div class="modal-box" style="max-width:480px">
        <h3><i class="ti ti-list-check" style="margin-right:6px;color:#185fa5"></i>${title}</h3>
        <p>Máy này chưa gắn với yêu cầu nào - chọn đúng yêu cầu bạn đang xử lý trên máy này.</p>
        <div style="max-height:340px;overflow-y:auto">
          ${list.map(r => `
            <div class="req-card" data-pick-id="${r.id}" style="cursor:pointer">
              <div class="row" style="margin-bottom:4px;justify-content:space-between">
                <strong>${r.id}</strong>
                <span class="badge ${r.status==='approved'?'approved':'pending'}">${r.status==='approved'?'Đã cấp':'Đang chờ'}</span>
              </div>
              <div class="row" style="margin-bottom:0"><span class="label">Sản phẩm</span><span>${r.sp.ten} - ${r.may}</span></div>
            </div>
          `).join('')}
        </div>
        <div class="btn-row">
          <button id="btnPickerCancel" style="width:100%">Hủy</button>
        </div>
      </div>
    </div>
  `;
  const overlay = document.getElementById('pickerOverlay');
  const close = () => { root.innerHTML = ''; };
  document.getElementById('btnPickerCancel').onclick = close;
  overlay.onclick = (e) => { if(e.target === overlay) close(); };
  root.querySelectorAll('[data-pick-id]').forEach(el => {
    el.onclick = () => {
      const id = el.getAttribute('data-pick-id');
      close();
      onPick(id);
    };
  });
}

function attachTronEvents(){
  const spSearch = document.getElementById('spSearch');
  if(spSearch){
    spSearch.oninput = (e) => {
      tronState.spSearchText = e.target.value;
      if(tronState.sp && tronState.sp.ten !== e.target.value){ tronState.sp = null; renderStep1Summary(); }
      renderSpSuggestions(e.target.value);
    };
    spSearch.onfocus = (e) => { renderSpSuggestions(e.target.value); };
    spSearch.onblur = () => { setTimeout(() => { const box = document.getElementById('spSuggestions'); if(box) box.style.display = 'none'; }, 150); };
  }
  const selMay = document.getElementById('selMay');
  if(selMay) selMay.onchange = e => { tronState.may = e.target.value; renderStep1Summary(); };
  const inpSL = document.getElementById('inpSL');
  if(inpSL) inpSL.oninput = e => {
    const v = e.target.value.replace(/[^0-9.]/g, '');
    tronState.soluong = parseFloat(v) || 0;
    renderStep1Summary();
  };
  const btnSubmit = document.getElementById('btnSubmitReq');
  if(btnSubmit) btnSubmit.onclick = async () => {
    btnSubmit.disabled = true;
    btnSubmit.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang gửi...';
    const c = calcBaoTui(tronState.sp, tronState.soluong);
    const id = genId();
    const reqData = { id, thoigian: new Date().toLocaleString('vi-VN'), sp_ten: tronState.sp.ten, sp_nhua: tronState.sp.nhua, sp_mau: tronState.sp.mau, sp_tyle: tronState.sp.tyle, may: tronState.may, soluong: tronState.soluong, bao: c.bao, tui: c.tui, nhuakg: c.nhuaKg, maukg: c.mauKg, baodu: c.baoDu, baolekg: c.baoLeKg, tuidu: c.tuiDu, tuileg: c.tuiLeG, status: 'pending', kehoachid: tronState.kehoachId || '' };
    try{
      await apiPost({action:'addRequest', data: reqData});
      setActiveReqId(id); tronState.step = 2; saveTronStep(); tronState.sp = null; tronState.may=''; tronState.soluong=0; tronState.spSearchText=''; tronState.kehoachId=null;
      showToast('Da gui request '+id+' - dang cho kho cap '+c.bao+' bao + '+c.tui+' tui');
      await loadRequests(); renderAll();
    }catch(err){
      showToast('Loi gui request - kiem tra ket noi mang', true);
      btnSubmit.disabled = false; btnSubmit.innerHTML = '<i class="ti ti-send" style="margin-right:4px"></i>Gửi yêu cầu cho kho';
    }
  };
  const btnGoScan = document.getElementById('btnGoScan');
  if(btnGoScan) btnGoScan.onclick = async () => {
    btnGoScan.disabled = true; btnGoScan.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang tải...';
    scanState = await loadScanState(activeReqId);
    tronState.step = 3; saveTronStep(); renderTronApp();
  };
  const btnRefresh2 = document.getElementById('btnRefresh2');
  if(btnRefresh2) btnRefresh2.onclick = async () => { btnRefresh2.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Dang tai...'; await loadRequests(); renderTronApp(); };
  const btnEditReq = document.getElementById('btnEditReq');
  if(btnEditReq) btnEditReq.onclick = () => {
    const myReq = requests.find(r => r.id === activeReqId);
    if(!myReq) return;
    const root = document.getElementById('modalRoot');
    root.innerHTML = `
      <div class="modal-overlay" id="editReqOverlay">
        <div class="modal-box" style="max-width:400px">
          <h3><i class="ti ti-pencil" style="margin-right:6px;color:#185fa5"></i>Sửa yêu cầu ${myReq.id}</h3>
          <p style="font-size:13px;color:#777;margin:0 0 14px">Chỉnh lại số lượng — hệ thống sẽ tính lại số bao nhựa và túi màu tự động.</p>
          <div class="row"><span class="label">Sản phẩm</span><strong>${myReq.sp.ten}</strong></div>
          <div class="row"><span class="label">Máy</span><strong>${myReq.may}</strong></div>
          <div class="row">
            <span class="label">Số lượng nhựa (kg)</span>
            <input type="text" inputmode="decimal" id="editSoLuong" value="${myReq.soluong}" style="max-width:120px">
          </div>
          <div id="editCalcPreview" style="font-size:13px;color:#777;margin:6px 0 14px;padding:10px;background:#f7f7f7;border-radius:8px"></div>
          <div class="btn-row">
            <button id="btnEditCancel" style="flex:1">Hủy</button>
            <button class="primary" id="btnEditSave" style="flex:1"><i class="ti ti-check" style="margin-right:4px"></i>Cập nhật yêu cầu</button>
          </div>
        </div>
      </div>`;
    const overlay = document.getElementById('editReqOverlay');
    const inp = document.getElementById('editSoLuong');
    const preview = document.getElementById('editCalcPreview');
    const updatePreview = () => {
      const sl = parseFloat(inp.value) || 0;
      if(!sl){ preview.textContent = ''; return; }
      const c = calcBaoTui(myReq.sp, sl);
      const baoLeInfo = c.baoLeKg > 0 ? ` (${c.baoDu} đủ + 1 lẻ ${fmt(c.baoLeKg,2)}kg)` : '';
      const tuiLeInfo = c.tuiLeG > 0 ? ` (${c.tuiDu} đủ + 1 lẻ ${fmt(c.tuiLeG,1)}g)` : '';
      preview.innerHTML = `→ Cần <strong>${c.bao} bao nhựa (${myReq.sp.nhua})</strong>${baoLeInfo} + <strong>${c.tui} túi màu (${myReq.sp.mau})</strong>${tuiLeInfo}<br>Nhựa: ${fmt(c.nhuaKg,1)} kg · Màu: ${fmt(c.mauKg*1000,0)} g`;
    };
    updatePreview();
    inp.oninput = updatePreview;
    const close = () => { root.innerHTML = ''; };
    document.getElementById('btnEditCancel').onclick = close;
    overlay.onclick = e => { if(e.target === overlay) close(); };
    document.getElementById('btnEditSave').onclick = async () => {
      const sl = parseFloat(inp.value) || 0;
      if(sl <= 0){ showToast('Số lượng phải lớn hơn 0', true); return; }
      const c = calcBaoTui(myReq.sp, sl);
      const btn = document.getElementById('btnEditSave');
      btn.disabled = true;
      btn.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang cập nhật...';
      try{
        await apiPost({action:'editRequest', id: myReq.id, data: {
          soluong: sl, bao: c.bao, tui: c.tui,
          nhuakg: c.nhuaKg, maukg: c.mauKg,
          baodu: c.baoDu, baolekg: c.baoLeKg, tuidu: c.tuiDu, tuileg: c.tuiLeG
        }});
        showToast('Đã cập nhật yêu cầu — ' + c.bao + ' bao nhựa + ' + c.tui + ' túi màu');
        close();
        await loadRequests();
        renderAll();
      }catch(err){
        showToast('Lỗi cập nhật - kiểm tra kết nối mạng', true);
        btn.disabled = false;
        btn.innerHTML = '<i class="ti ti-check" style="margin-right:4px"></i>Cập nhật yêu cầu';
      }
    };
  };
  const btnCancelReq = document.getElementById('btnCancelReq');
  if(btnCancelReq) btnCancelReq.onclick = async () => {
    if(confirm('Hủy yêu cầu này?')){
      try{
        await clearScanState(activeReqId);
        await apiPost({action:'deleteRequest', id: activeReqId}); setActiveReqId(null); tronState.step = 1; saveTronStep(); await loadRequests(); renderAll();
      }
      catch(err){ showToast('Lỗi hủy yêu cầu', true); }
    }
  };
  const scanBao = document.getElementById('scanBao');
  const handleScanBao = (val) => {
    const myReq = requests.find(r => r.id === activeReqId);
    if(!myReq) return;
    if(val.toUpperCase() === String(myReq.sp.nhua).toUpperCase()){
      scanState.baoQuet++; saveScanState();
      showToast('Bao nhựa #'+scanState.baoQuet+' ✓ '+myReq.sp.nhua);
      renderTronApp();
    } else {
      showToast('Sai loại nhựa! Cần "'+myReq.sp.nhua+'" - quét "'+val+'"', true);
    }
  };
  const triggerScanBao = wireScanInput(scanBao, handleScanBao);
  const btnScanBaoOk = document.getElementById('btnScanBaoOk');
  if(btnScanBaoOk && triggerScanBao) btnScanBaoOk.onclick = () => triggerScanBao();

  const scanTui = document.getElementById('scanTui');
  const handleScanTui = (val) => {
    const myReq = requests.find(r => r.id === activeReqId);
    if(!myReq) return;
    if(val.toUpperCase() === String(myReq.sp.mau).toUpperCase()){
      scanState.tuiQuet++; saveScanState();
      showToast('Túi màu #'+scanState.tuiQuet+' ✓ '+myReq.sp.mau);
      renderTronApp();
    } else {
      showToast('Sai loại màu! Cần "'+myReq.sp.mau+'" - quét "'+val+'"', true);
    }
  };
  const triggerScanTui = wireScanInput(scanTui, handleScanTui);
  const btnScanTuiOk = document.getElementById('btnScanTuiOk');
  if(btnScanTuiOk && triggerScanTui) btnScanTuiOk.onclick = () => triggerScanTui();
  const inpBaoLeThucTe = document.getElementById('inpBaoLeThucTe');
  if(inpBaoLeThucTe) inpBaoLeThucTe.oninput = e => { tronState.baoLeKgThucTe = parseFloat(e.target.value) || 0; };
  const inpTuiLeThucTe = document.getElementById('inpTuiLeThucTe');
  if(inpTuiLeThucTe) inpTuiLeThucTe.oninput = e => { tronState.tuiLeGThucTe = parseFloat(e.target.value) || 0; };
  const btnConfirm = document.getElementById('btnConfirmTron');
  if(btnConfirm) btnConfirm.onclick = async () => {
    const myReq = requests.find(r => r.id === activeReqId);
    if(!myReq) return;
    btnConfirm.disabled = true; btnConfirm.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang lưu...';
    const safetyTimer = setTimeout(() => {
      if(btnConfirm.disabled){
        btnConfirm.disabled = false;
        btnConfirm.innerHTML = '<i class="ti ti-check" style="margin-right:6px"></i>Xác nhận trộn - lưu lịch sử';
        showToast('Lưu mất quá nhiều thời gian - kiểm tra mạng rồi thử lại. Dữ liệu chưa được lưu.', true);
      }
    }, 20000);
    const baoKgUnit = myReq.sp.baoKg || DEFAULT_BAO_KG;
    const tuiGUnit = myReq.sp.tuiG || DEFAULT_TUI_G;
    const actualNhuaKg = myReq.baoLeKg > 0
      ? (myReq.baoDu * baoKgUnit) + (tronState.baoLeKgThucTe ?? myReq.baoLeKg)
      : myReq.nhuaKg;
    const actualMauG = myReq.tuiLeG > 0
      ? (myReq.tuiDu * tuiGUnit) + (tronState.tuiLeGThucTe ?? myReq.tuiLeG)
      : Math.round(myReq.mauKg*1000);
    const record = { thoigian: new Date().toLocaleString('vi-VN'), reqId: myReq.id, sanpham: myReq.sp.ten, may: myReq.may, loainhua: myReq.sp.nhua, loaimau: myReq.sp.mau, tyle: myReq.sp.tyle, soluongnhua_kg: actualNhuaKg, soluongmau_g: Math.round(actualMauG), baoQuet: scanState.baoQuet, tuiQuet: scanState.tuiQuet, kehoachid: myReq.kehoachid || '' };
    try{
      btnConfirm.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang lưu lịch sử...';
      await apiPost({action:'addHistory', data: record});
      btnConfirm.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang xóa yêu cầu...';
      await apiPost({action:'deleteRequest', id: myReq.id});
      await clearScanState(myReq.id);
      clearTimeout(safetyTimer);
      setActiveReqId(null); tronState.step = 1; saveTronStep(); tronState.baoLeKgThucTe = null; tronState.tuiLeGThucTe = null;
      showToast('Đã lưu lịch sử trộn liệu thành công!');
      await loadRequests(); await loadHistory(); renderAll();
    }catch(err){
      clearTimeout(safetyTimer);
      showToast('Lỗi lưu lịch sử - kiểm tra kết nối mạng', true);
      btnConfirm.disabled = false; btnConfirm.innerHTML = '<i class="ti ti-check" style="margin-right:6px"></i>Xác nhận trộn - lưu lịch sử';
    }
  };
  document.querySelectorAll('.step-pill').forEach((el, idx) => {
    el.onclick = async () => {
      const myReq = requests.find(r => r.id === activeReqId);
      if(idx === 0){
        if(tronState.step !== 1){
          if(confirm('Quay về bước gửi yêu cầu mới? Yêu cầu hiện tại vẫn được giữ.')){ tronState.step = 1; saveTronStep(); renderAll(); }
        }
      } else if(idx === 1){
        if(!myReq){
          showRequestPicker(['pending','approved'], 'Chọn yêu cầu đang xử lý', async (id) => {
            setActiveReqId(id);
            tronState.step = 2; saveTronStep();
            await loadRequests(); renderAll();
          });
          return;
        }
        tronState.step = 2; saveTronStep(); renderTronApp();
      } else if(idx === 2){
        if(!myReq || myReq.status !== 'approved'){
          showRequestPicker(['approved'], 'Chọn yêu cầu để bắn mã vạch', async (id) => {
            setActiveReqId(id);
            scanState = await loadScanState(id);
            tronState.step = 3; saveTronStep();
            renderAll();
          });
          return;
        }
        scanState = await loadScanState(activeReqId);
        tronState.step = 3; saveTronStep(); renderTronApp();
      } else if(idx === 3){
        await loadHistory(); tronState.step = 4; saveTronStep(); renderTronApp();
      }
    };
  });

  if(tronState.step === 3){
    const myReq = requests.find(r => r.id === activeReqId);
    if(myReq){
      const baoOk = scanState.baoQuet >= myReq.bao;
      const tuiOk = scanState.tuiQuet >= myReq.tui;
      let focusId = null;
      if(!baoOk) focusId = 'scanBao';
      else if(!tuiOk) focusId = 'scanTui';
      if(focusId){
        const toFocus = document.getElementById(focusId);
        if(toFocus) toFocus.focus();
      }
    }
  }
}

function renderKhoApp(){
  const v = document.getElementById('kho-app');
  v.innerHTML = `
    <div class="tabs-bar" style="margin-bottom:1rem">
      <button class="tab-btn ${khoSubTab==='requests'?'active':''}" id="khoTabRequests"><i class="ti ti-clipboard-list"></i>Yêu cầu cấp hàng</button>
      <button class="tab-btn ${khoSubTab==='inventory'?'active':''}" id="khoTabInventory"><i class="ti ti-building-warehouse"></i>Tồn kho &amp; Nhập kho</button>
    </div>
    <div id="khoSubContent"></div>
  `;
  document.getElementById('khoTabRequests').onclick = () => { khoSubTab = 'requests'; renderKhoApp(); };
  document.getElementById('khoTabInventory').onclick = () => {
    khoSubTab = 'inventory';
    renderKhoApp();
    if(!khoInventoryLoaded){
      Promise.all([loadTonKhoNhua(), loadTonKhoMau(), loadNhapKhoLog(), loadCatalogFromServer()]).then(() => {
        khoInventoryLoaded = true;
        if(currentRole === 'kho' && khoSubTab === 'inventory') renderKhoApp();
      });
    }
  };
  if(khoSubTab === 'requests') renderKhoRequestsSection();
  else renderKhoInventorySection();
}

  document.querySelectorAll('[data-approve]').forEach(btn => {

function distinctNhuaList(){ return [...new Set(PRODUCTS.map(p=>p.nhua).filter(Boolean))]; }
function distinctMauList(){ return [...new Set(PRODUCTS.map(p=>p.mau).filter(Boolean))]; }

function groupTonKhoMauByLoai(){
  const grouped = {};
  tonKhoMau.forEach(lo => {
    const key = String(lo.loaimau || '').trim();
    if(!key) return;
    if(!grouped[key]) grouped[key] = [];
    grouped[key].push(lo);
  });
  return grouped;
}

function exportCSV(){
  const headers = ['Thoi gian','Ma request','San pham','May','Loai nhua','SL nhua (kg)','Loai mau','SL mau (g)','Ti le tron','So bao quet','So tui quet'];
  const rows = history.map(h => [h.thoigian, h.reqId||'', h.sanpham, h.may, h.loainhua, h.soluongnhua_kg, h.loaimau, h.soluongmau_g, h.tyle, h.baoQuet, h.tuiQuet]);
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => { csv += r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',') + '\n'; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'lich_su_tron_lieu_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Đã xuất file CSV lịch sử');
}

let khSelectedSp = null;

function renderKhSpSuggestions(filterText){
  const box = document.getElementById('khSpSuggestions');

  const matches = q ? PRODUCTS.filter(p => p.ten.toLowerCase().includes(q)) : PRODUCTS;
  box.innerHTML = matches.length === 0
    ? '<div class="autocomplete-empty">Không tìm thấy sản phẩm nào</div>'
    : matches.map((p) => `<div class="autocomplete-item" data-idx="${PRODUCTS.indexOf(p)}">${p.ten}</div>`).join('');
  box.style.display = 'block';
  box.querySelectorAll('.autocomplete-item[data-idx]').forEach(el => {
    el.onmousedown = (e) => {
      e.preventDefault();
      const idx = Number(el.getAttribute('data-idx'));
      khSelectedSp = PRODUCTS[idx];
      document.getElementById('khSpSearch').value = khSelectedSp.ten;
      document.getElementById('khSpInfo').textContent = 'Loại nhựa: ' + khSelectedSp.nhua + ' · Loại màu: ' + khSelectedSp.mau;
      box.style.display = 'none';
    };
  });
}

  document.querySelectorAll('[data-edit-kh]').forEach(btn => {

function showExportScheduleModal(){
  const activePlans = keHoachList.filter(p => computeKeHoachProgress(p).conLaiTron > 0);
  if(activePlans.length === 0){ showToast('Không có kế hoạch nào còn tồn đọng', true); return; }
  const autoMach = {};
  activePlans.forEach(p => {
    if(p.may){ autoMach[p.id] = p.may; return; }
    const req = requests.find(r => r.kehoachid === p.id);
    if(req){ autoMach[p.id] = req.may; return; }
    const h = history.find(hh => hh.kehoachid === p.id);
    if(h){ autoMach[p.id] = h.may; }
  });
  const today = new Date();
  const todayStr = today.toISOString().slice(0,10);
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="scheduleOverlay">
      <div class="modal-box" style="max-width:560px;max-height:90vh;overflow-y:auto">
        <h3><i class="ti ti-calendar-stats" style="margin-right:6px;color:#185fa5"></i>Xuất kế hoạch trộn theo máy</h3>
        <div class="row"><span class="label">Từ ngày</span><input type="date" id="schDateFrom" value="${todayStr}"></div>
        <div class="row"><span class="label">Đến ngày</span><input type="date" id="schDateTo" value="${todayStr}"></div>
        <div class="row">
          <span class="label">Bỏ qua ngày</span>
          <div>
            <label style="margin-right:10px"><input type="checkbox" id="skipSun" checked> Chủ nhật</label>
            <label><input type="checkbox" id="skipSat"> Thứ 7</label>
          </div>
        </div>
        <div style="border-top:1px solid #eee;padding-top:12px;margin-top:4px">
          <p style="font-size:13px;font-weight:600;margin:0 0 8px;color:#185fa5"><i class="ti ti-link" style="margin-right:4px"></i>Gắn mỗi kế hoạch vào máy sản xuất:</p>
          ${activePlans.map(p => {
            const prog = computeKeHoachProgress(p);
            return `<div class="row" style="margin-bottom:8px">
              <span class="label" style="font-size:12px;min-width:0;flex:1;line-height:1.3">
                <strong>${p.sanpham.split(' ').slice(0,4).join(' ')}</strong><br>
                <span style="color:#777;font-size:11px">${p.loainhua} · Còn: ${fmt(prog.conLaiTron,0)} kg</span>
              </span>
              <select class="planMachSel" data-planid="${p.id}" style="flex:0 0 160px">
                <option value="">-- Chọn máy --</option>
                ${MAY_LIST.map(m => `<option value="${m}" ${autoMach[p.id]===m?'selected':''  }>${m}</option>`).join('')}
              </select>
            </div>`;
          }).join('')}
        </div>
        <div class="btn-row">
          <button id="btnScheduleCancel" style="flex:1">Hủy</button>
          <button class="primary" id="btnScheduleOk" style="flex:1"><i class="ti ti-printer" style="margin-right:4px"></i>Tạo & In</button>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('scheduleOverlay');
  document.getElementById('btnScheduleCancel').onclick = () => { root.innerHTML = ''; };
  overlay.onclick = e => { if(e.target === overlay) root.innerHTML = ''; };
  document.getElementById('btnScheduleOk').onclick = () => {
    const from = new Date(document.getElementById('schDateFrom').value);
    const to = new Date(document.getElementById('schDateTo').value);
    const skipSun = document.getElementById('skipSun').checked;
    const skipSat = document.getElementById('skipSat').checked;
    if(isNaN(from) || isNaN(to) || from > to){ showToast('Ngày không hợp lệ', true); return; }
    const planMachMap = {};
    document.querySelectorAll('.planMachSel').forEach(sel => {
      if(sel.value) planMachMap[sel.getAttribute('data-planid')] = sel.value;
    });
    const assignedPlans = activePlans.filter(p => planMachMap[p.id]);
    if(assignedPlans.length === 0){ showToast('Vui lòng chọn máy cho ít nhất 1 kế hoạch', true); return; }
    const days = [];
    for(let d = new Date(from); d <= to; d.setDate(d.getDate()+1)){
      const dow = d.getDay();
      if(skipSun && dow === 0) continue;
      if(skipSat && dow === 6) continue;
      days.push(new Date(d));
    }
    if(days.length === 0){ showToast('Không có ngày làm việc nào trong khoảng đã chọn', true); return; }
    root.innerHTML = '';
    printSchedule(assignedPlans, days, planMachMap);
  };
}

function printSchedule(plans, days, planMachMap){
  function parseDateFromVN(str){
    if(!str) return null;
    const m = str.match(/(\d{1,2})\/(\d{1,2})\/(\d{4})/);
    if(!m) return null;
    return `${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;
  }

  const machines = [...new Set(Object.values(planMachMap))];

  const actualByMachDate = {};
  machines.forEach(m => { actualByMachDate[m] = {}; });
  history.forEach(h => {
    if(!h.may || !machines.includes(h.may)) return;
    const dateStr = parseDateFromVN(h.thoigian);
    if(!dateStr) return;
    if(!actualByMachDate[h.may][dateStr]) actualByMachDate[h.may][dateStr] = {kg:0, items:[]};
    actualByMachDate[h.may][dateStr].kg += Number(h.soluongnhua_kg) || 0;
    if(h.sanpham) actualByMachDate[h.may][dateStr].items.push(h.sanpham.split(' ').slice(0,3).join(' '));
  });

  const machPlan = {};
  plans.forEach(p => {
    const m = planMachMap[p.id];
    if(m) machPlan[m] = p;
  });

  const machKHPerDay = {};
  machines.forEach(m => {
    const plan = machPlan[m];
    if(plan){
      const prog = computeKeHoachProgress(plan);
      machKHPerDay[m] = fmt(prog.conLaiTron / days.length, 1);
    } else {
      machKHPerDay[m] = '0';
    }
  });

  const headerCells = machines.map(m => {
    const plan = machPlan[m];
    const sub = plan ? `<br><span style="font-size:10px;font-weight:400;opacity:0.85">${plan.sanpham.split(' ').slice(0,3).join(' ')} · ${plan.loainhua}</span>` : '';
    return `<th colspan="2" style="padding:8px 6px;border:1px solid #bbb;background:#185fa5;color:#fff;text-align:center;white-space:nowrap">${m}${sub}</th>`;
  }).join('');

  const subHeader = machines.map(() =>
    `<th style="padding:6px;border:1px solid #bbb;background:#2980b9;color:#fff;font-size:11px;text-align:center">KH (kg)</th>
     <th style="padding:6px;border:1px solid #bbb;background:#1e6e3d;color:#fff;font-size:11px;text-align:center;border-right:2px solid #999">TT Trộn</th>`
  ).join('');

  const rows = days.map((d, di) => {
    const dateStr = d.toLocaleDateString('vi-VN', {weekday:'short', day:'2-digit', month:'2-digit'});
    const isoDate = d.toISOString().slice(0,10);
    const bg = di % 2 === 0 ? '#fff' : '#f9f9f9';
    const cells = machines.map(m => {
      const act = actualByMachDate[m][isoDate];
      const ttKg = act ? act.kg : 0;
      const ttLabel = ttKg > 0 ? `${fmt(ttKg,1)} kg` : '-';
      const tooltip = act && act.items.length > 0 ? `title="${[...new Set(act.items)].join(', ')}"` : '';
      return `
        <td style="text-align:center;padding:5px 6px;border:1px solid #ddd">
          <input type="number" value="${machKHPerDay[m]}" min="0" step="0.5"
            style="width:65px;text-align:center;border:1px solid #ccc;border-radius:4px;padding:4px 3px;font-size:12px;background:#fffde7">
        </td>
        <td ${tooltip} style="text-align:center;padding:5px 6px;border:1px solid #ddd;color:${ttKg>0?'#1e8449':'#bbb'};font-weight:${ttKg>0?'600':'400'};border-right:2px solid #ccc;cursor:${act?'help':'default'};font-size:13px">${ttLabel}</td>`;
    }).join('');
    return `<tr style="background:${bg}"><td style="padding:6px 10px;border:1px solid #ddd;white-space:nowrap;font-size:13px">${dateStr}</td>${cells}</tr>`;
  }).join('');

  const totalCells = machines.map(m => {
    const ttTotal = Object.values(actualByMachDate[m]).reduce((s,v)=>s+v.kg,0);
    const plan = machPlan[m];
    const khTotal = plan ? fmt(computeKeHoachProgress(plan).conLaiTron, 1) : '-';
    return `<td style="padding:7px;border:1px solid #ddd;font-weight:700;text-align:center;color:#c0392b">${khTotal} kg</td>
            <td style="padding:7px;border:1px solid #ddd;font-weight:700;text-align:center;color:#1e8449;border-right:2px solid #ccc">${ttTotal>0?fmt(ttTotal,1)+' kg':'-'}</td>`;
  }).join('');

  const win = window.open('', '_blank', 'width=1100,height=750');
  win.document.write(`<!DOCTYPE html><html><head><meta charset="UTF-8">
    <title>KH Trộn theo máy ${days[0].toLocaleDateString('vi-VN')}-${days[days.length-1].toLocaleDateString('vi-VN')}</title>
    <style>
      body{font-family:Arial,sans-serif;padding:20px;color:#222;font-size:14px}
      h2{margin-bottom:4px;color:#185fa5}
      table{border-collapse:collapse;width:100%;margin-bottom:20px}
      input[type=number]{background:#fffde7}
      .noprint{display:block}
      @media print{
        .noprint{display:none}
        input{border:none!important;background:transparent!important;font-weight:600}
      }
    </style>
  </head><body>
    <h2>📋 KẾ HOẠCH TRỘN LIỆU THEO MÁY</h2>
    <p style="color:#777;margin-bottom:8px;font-size:13px">
      ${days[0].toLocaleDateString('vi-VN')} → ${days[days.length-1].toLocaleDateString('vi-VN')} · ${days.length} ngày · ${machines.length} máy · In lúc ${new Date().toLocaleString('vi-VN')}
    </p>
    <p class="noprint" style="background:#fffde7;padding:8px 12px;border-radius:6px;border:1px solid #f0e060;font-size:13px;margin-bottom:14px">
      💡 Cột <strong>"KH (kg)"</strong> có thể sửa tay. Cột <span style="color:#1e8449"><strong>"TT Trộn"</strong></span> tự động từ lịch sử (rê chuột vào để xem sản phẩm).
    </p>
    <table>
      <thead>
        <tr>
          <th rowspan="2" style="padding:8px 10px;border:1px solid #bbb;background:#185fa5;color:#fff;text-align:left">Ngày</th>
          ${headerCells}
        </tr>
        <tr>${subHeader}</tr>
      </thead>
      <tbody>${rows}</tbody>
      <tfoot>
        <tr style="background:#f5f5f5">
          <td style="padding:7px 10px;border:1px solid #ddd;font-weight:700">TỔNG</td>
          ${totalCells}
        </tr>
      </tfoot>
    </table>
    <div class="noprint" style="display:flex;gap:10px">
      <button onclick="window.print()" style="padding:10px 20px;background:#185fa5;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">🖨️ In / Lưu PDF</button>
      <button onclick="exportCSV()" style="padding:10px 20px;background:#1e8449;color:#fff;border:none;border-radius:8px;cursor:pointer;font-size:14px">📥 Xuất CSV</button>
      <button onclick="window.close()" style="padding:10px 20px;background:#eee;border:1px solid #ccc;border-radius:8px;cursor:pointer;font-size:14px">Đóng</button>
    </div>
    <script>
    function exportCSV(){
      const rows=[];
      document.querySelectorAll('table tr').forEach(tr=>{
        const cols=[];
        tr.querySelectorAll('th,td').forEach(td=>{
          const inp=td.querySelector('input');
          cols.push('"'+(inp?inp.value:td.innerText.trim()).replace(/"/g,'""')+'"');
        });
        rows.push(cols.join(','));
      });
      const b=new Blob(['\uFEFF'+rows.join('\\n')],{type:'text/csv;charset=utf-8'});
      const a=document.createElement('a');
      a.href=URL.createObjectURL(b);
      a.download='ke_hoach_tron_theo_may.csv';
      a.click();
    }
    <\/script>
  </body></html>`);
  win.document.close();
}


let keHoachList = [];

function normalizeKeHoachRow(r){
  const findKey = (obj, candidates) => {
    const keys = Object.keys(obj);
    for(const cand of candidates){
      const hit = keys.find(k => k.trim().toLowerCase() === cand);
      if(hit !== undefined && obj[hit] !== '' && obj[hit] !== undefined && obj[hit] !== null) return obj[hit];
    }
    return '';
  };
  return {
    id: String(findKey(r, ['id']) || ''),
    sanpham: String(findKey(r, ['sanpham','sản phẩm','san pham']) || ''),
    loainhua: String(findKey(r, ['loainhua','loại nhựa','loai nhua']) || ''),
    soluongkehoach: Number(findKey(r, ['soluongkehoach','số lượng kế hoạch','so luong ke hoach'])) || 0,
    thoigian: String(findKey(r, ['thoigian','thời gian','thoi gian']) || ''),
    ghichu: String(findKey(r, ['ghichu','ghi chú','ghi chu']) || ''),
    may: String(findKey(r, ['may','máy']) || ''),
    loaimau: String(findKey(r, ['loaimau','loại màu','loai mau']) || '')
  };
}

async function loadKeHoach(){
  try{ const data = await apiGet('getKeHoach'); if(Array.isArray(data)){ keHoachList = data.map(normalizeKeHoachRow).reverse(); } }catch(err){}
}

function normCode(v){ return String(v ?? '').trim().toUpperCase(); }

function computeKeHoachProgress(plan){
  const target = Number(plan.soluongkehoach) || 0;
  const daTron = history
    .filter(h => h.kehoachid && String(h.kehoachid) === String(plan.id))
    .reduce((sum, h) => sum + (Number(h.soluongnhua_kg) || 0), 0);
  const daCap = capLieuHistory
    .filter(h => h.kehoachid && String(h.kehoachid) === String(plan.id) && String(h.ketqua).toUpperCase() === 'OK')
    .reduce((sum, h) => sum + (Number(h.sokg) || 0), 0);
  return {
    target,
    daTron,
    conLaiTron: Math.max(0, target - daTron),
    daCap,
    conLaiCap: Math.max(0, target - daCap)
  };
}

function findActivePlanByLoaiNhua(loainhua){
  if(!loainhua) return null;
  const code = normCode(loainhua);
  return keHoachList.find(p => normCode(p.loainhua) === code) || null;
}

// Tinh tong kg thuc te da cap: neu co danh dau "bao cuoi la bao le", bao cuoi cung
// tinh theo can thuc te thay vi trong luong chuan (baoKg) nhu cac bao con lai.
function tinhTongKgCapLieu(){
  const total = capLieuState.scans.length;
  if(total === 0) return 0;
  if(capLieuState.baoCuoiLaBaoLe){
    return Math.max(0, total - 1) * capLieuState.baoKg + (Number(capLieuState.baoLeKgThucTe) || 0);
  }
  return total * capLieuState.baoKg;
}

function attachCapLieuEvents(){
  const scanSoMay = document.getElementById('clScanSoMay');
  const handleScanSoMay = (val) => {
    const matched = MAY_LIST.find(m => m.toUpperCase() === val.toUpperCase());
    if(matched){
      capLieuState.maMay = matched;
      capLieuState.mayConfirmed = true;
      renderCapLieuApp();
    } else {
      showToast('Không tìm thấy máy "'+val+'" trong danh sách 30 máy', true);
    }
  };
  const triggerScanSoMay = wireScanInput(scanSoMay, handleScanSoMay);
  const btnClSoMayOk = document.getElementById('btnClSoMayOk');
  if(btnClSoMayOk && triggerScanSoMay) btnClSoMayOk.onclick = () => triggerScanSoMay();
  const btnEditSoMay = document.getElementById('btnEditSoMay');
  if(btnEditSoMay) btnEditSoMay.onclick = () => {
    capLieuState.mayConfirmed = false; capLieuState.maMay = '';
    capLieuState.loaiMay = ''; capLieuState.loaiMayLocked = false; capLieuState.scans = [];
    renderCapLieuApp();
  };

  const scanMay = document.getElementById('clScanMay');
  const handleScanMay = (val) => {
    capLieuState.loaiMay = val;
    capLieuState.loaiMayLocked = true;
    renderCapLieuApp();
  };
  const triggerScanMay = wireScanInput(scanMay, handleScanMay);
  const btnClLoaiMayOk = document.getElementById('btnClLoaiMayOk');
  if(btnClLoaiMayOk && triggerScanMay) btnClLoaiMayOk.onclick = () => triggerScanMay();
  const btnEditLoaiMay = document.getElementById('btnEditLoaiMay');
  if(btnEditLoaiMay) btnEditLoaiMay.onclick = () => {
    capLieuState.loaiMayLocked = false; capLieuState.scans = []; capLieuState.kehoachId = null;
    renderCapLieuApp();
  };

  const scanMangRa = document.getElementById('clScanMangRa');
  const handleScanMangRa = (val) => {
    const match = val.toUpperCase() === capLieuState.loaiMay.trim().toUpperCase();
    capLieuState.scans.push({val, ketQua: match ? 'OK' : 'NG'});
    if(match) showToast('Bao #'+capLieuState.scans.length+' OK - đúng loại '+capLieuState.loaiMay);
    else {
      showToast('⚠️ CẤP SAI LIỆU! Bao #'+capLieuState.scans.length+' - Cần "'+capLieuState.loaiMay+'" nhưng quét "'+val+'"', true);
      notifyManagerWrongFeed(val);
    }
    renderCapLieuApp();
  };
  const triggerScanMangRa = wireScanInput(scanMangRa, handleScanMangRa);
  const btnClMangRaOk = document.getElementById('btnClMangRaOk');
  if(btnClMangRaOk && triggerScanMangRa) btnClMangRaOk.onclick = () => triggerScanMangRa();
  const btnUndo = document.getElementById('btnClUndo');
  if(btnUndo) btnUndo.onclick = () => { capLieuState.scans.pop(); renderCapLieuApp(); };

  const inpNguoiCap = document.getElementById('clNguoiCap');
  if(inpNguoiCap){
    inpNguoiCap.oninput = e => { capLieuState.nguoiCap = e.target.value; };
  }
  const clSelKeHoach = document.getElementById('clSelKeHoach');
  if(clSelKeHoach){ clSelKeHoach.onchange = e => { capLieuState.kehoachId = e.target.value || null; renderCapLieuApp(); }; }
  const clBaoKgInp = document.getElementById('clBaoKg');
  if(clBaoKgInp){ clBaoKgInp.oninput = e => { const v = parseFloat(e.target.value) || CAP_LIEU_BAO_KG; capLieuState.baoKg = v; renderCapLieuApp(); }; }
  const clBaoCuoiLe = document.getElementById('clBaoCuoiLe');
  if(clBaoCuoiLe){ clBaoCuoiLe.onchange = e => { capLieuState.baoCuoiLaBaoLe = e.target.checked; renderCapLieuApp(); }; }
  const clBaoLeKgInp = document.getElementById('clBaoLeKg');
  if(clBaoLeKgInp){ clBaoLeKgInp.oninput = e => { capLieuState.baoLeKgThucTe = parseFloat(e.target.value) || 0; renderCapLieuApp(); }; }

  const btnSave = document.getElementById('btnClSave');
  if(btnSave) btnSave.onclick = async () => {
    if(capLieuState.scans.length === 0){ showToast('Chưa quét bao nào', true); return; }
    // Kiem tra truoc (client-side) khong duoc cap vuot qua so kg da tron cua ke hoach -
    // canh bao ngay, khong can cho server tra loi, giup phat hien som truong hop ban qua so bao.
    const tongKgLanNay = tinhTongKgCapLieu();
    if(capLieuState.kehoachId){
      const plan = keHoachList.find(p => p.id === capLieuState.kehoachId);
      if(plan){
        const prog = computeKeHoachProgress(plan);
        const conLaiChoPhep = Math.max(0, prog.daTron - prog.daCap);
        if(tongKgLanNay > conLaiChoPhep + 0.05){
          showToast('⚠️ KHÔNG THỂ LƯU: Cấp ' + fmt(tongKgLanNay,1) + 'kg nhưng kế hoạch này mới trộn được ' + fmt(prog.daTron,1) + 'kg (đã cấp trước đó ' + fmt(prog.daCap,1) + 'kg) - chỉ còn được cấp tối đa ' + fmt(conLaiChoPhep,1) + 'kg. Vui lòng kiểm tra lại số bao quét.', true);
          return;
        }
      }
    }
    btnSave.disabled = true;
    btnSave.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang lưu...';
    const okCount = capLieuState.scans.filter(s => s.ketQua === 'OK').length;
    const ngCount = capLieuState.scans.filter(s => s.ketQua === 'NG').length;
    const ngVals = [...new Set(capLieuState.scans.filter(s => s.ketQua === 'NG').map(s => s.val))];
    const record = {
      thoigian: new Date().toLocaleString('vi-VN'),
      may: capLieuState.maMay,
      loaimay: capLieuState.loaiMay,
      loaimangra: ngCount === 0 ? capLieuState.loaiMay : ('Có sai: ' + ngVals.join(', ')),
      ketqua: ngCount === 0 ? 'OK' : 'NG',
      nguoicap: capLieuState.nguoiCap,
      kehoachid: capLieuState.kehoachId || '',
      ghichu: okCount + ' OK / ' + ngCount + ' NG tren tong ' + capLieuState.scans.length + ' bao',
      soluong: capLieuState.scans.length,
      sokg: tongKgLanNay
    };
    try{
      const res = await apiPost({action:'addCapLieu', data: record});
      if(res && res.ok === false && res.error === 'vuot_dinh_muc_tron'){
        showToast('⚠️ Hệ thống từ chối lưu: vượt định mức đã trộn. Kế hoạch mới trộn ' + fmt(res.daTron,1) + 'kg, đã cấp trước đó ' + fmt(res.daCapHienTai,1) + 'kg - chỉ còn được cấp tối đa ' + fmt(res.conLaiChoPhep,1) + 'kg (bạn đang cố cấp ' + fmt(res.sokgDeNghi,1) + 'kg).', true);
        btnSave.disabled = false;
        btnSave.innerHTML = '<i class="ti ti-device-floppy" style="margin-right:4px"></i>Luu bao cao cap lieu';
        return;
      }
      showToast('Đã lưu báo cáo cấp liệu - ' + capLieuState.scans.length + ' bao (' + okCount + ' OK / ' + ngCount + ' NG)');
      resetCapLieuForm();
      await Promise.all([loadCapLieu(), loadKeHoach()]);
      renderCapLieuApp();
    }catch(err){
      showToast('Lỗi lưu báo cáo - kiểm tra kết nối mạng', true);
      btnSave.disabled = false;
      btnSave.innerHTML = '<i class="ti ti-device-floppy" style="margin-right:4px"></i>Luu bao cao cap lieu';
    }
  };

  const btnReset = document.getElementById('btnClReset');
  if(btnReset) btnReset.onclick = () => { resetCapLieuForm(); renderCapLieuApp(); };

  const btnRefresh = document.getElementById('btnClRefresh');
  if(btnRefresh) btnRefresh.onclick = async () => { btnRefresh.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Dang tai...'; await loadCapLieu(); renderCapLieuApp(); };

  const btnExport = document.getElementById('btnClExport');
  if(btnExport) btnExport.onclick = exportCapLieuCSV;

  let focusId = 'clScanSoMay';
  if(capLieuState.mayConfirmed && !capLieuState.loaiMayLocked) focusId = 'clScanMay';
  else if(capLieuState.loaiMayLocked) focusId = document.getElementById('clScanMangRa') ? 'clScanMangRa' : 'clSelKeHoach';
  const toFocus = document.getElementById(focusId);
  if(toFocus) toFocus.focus();
}

// Gửi cảnh báo cấp liệu sai cho quản lý ngay lập tức (server sẽ gửi email + ghi log CanhBao)
async function notifyManagerWrongFeed(scannedVal){
  try{
    await apiPost({
      action: 'notifyWrongFeed',
      data: {
        thoigian: new Date().toLocaleString('vi-VN'),
        may: capLieuState.maMay,
        loaiCanDung: capLieuState.loaiMay,
        loaiQuetSai: scannedVal,
        nguoicap: capLieuState.nguoiCap
      }
    });
  }catch(err){ /* best-effort - khong chan luong lam viec neu gui canh bao loi */ }
}

function exportCapLieuCSV(){
  const headers = ['Thoi gian','May','Loai tren may','Loai mang ra','So bao','So kg','Nguoi cap','Ket qua'];
  const rows = capLieuHistory.map(h => [h.thoigian, h.may, h.loaimay, h.loaimangra, h.soluong, h.sokg, h.nguoicap, h.ketqua]);
  let csv = '\uFEFF' + headers.join(',') + '\n';
  rows.forEach(r => { csv += r.map(c => `"${String(c).replace(/"/g,'""')}"`).join(',') + '\n'; });
  const blob = new Blob([csv], {type:'text/csv;charset=utf-8;'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a'); a.href = url; a.download = 'bao_cao_cap_lieu_' + new Date().toISOString().slice(0,10) + '.csv';
  document.body.appendChild(a); a.click(); document.body.removeChild(a); URL.revokeObjectURL(url);
  showToast('Da xuat file CSV bao cao cap lieu');
}

function renderAll(){
  renderPendingBadge();
  if(currentRole === 'tron'){
    renderTronApp();
    if(tronState.step === 4){ const btnExp = document.getElementById('btnExportCSV'); if(btnExp) btnExp.onclick = exportCSV; }
  } else if(currentRole === 'kho'){
    renderKhoApp();
  } else if(currentRole === 'caplieu'){
    renderCapLieuApp();
  } else if(currentRole === 'catalog'){
    renderCatalogApp();
  } else if(currentRole === 'kehoach'){
    renderKeHoachApp();
  }
}

// ---------- Access control: khóa mật khẩu RIÊNG cho Danh Mục & Kế Hoạch ----------
// Các tab còn lại (Tổ Trộn, Kho, Cấp Liệu) vẫn mở tự do như trước, không cần mật khẩu.
const ROLE_NAMES = { tron: 'Tổ Trộn', kho: 'Kho', caplieu: 'Cấp Liệu', catalog: 'Danh Mục', kehoach: 'Kế Hoạch' };
const PROTECTED_TAB_LABELS = { danhmuc: 'Danh Mục', kehoach: 'Kế Hoạch' };

let unlockedTabs = (function(){
  try{ return JSON.parse(localStorage.getItem('mixcontrol_unlockedTabs') || '{}'); }catch(e){ return {}; }
})();
function saveUnlockedTabs(){
  try{ localStorage.setItem('mixcontrol_unlockedTabs', JSON.stringify(unlockedTabs)); }catch(e){}
}
function isTabUnlocked(tab){ return !!unlockedTabs[tab]; }
function updateLockLinkVisibility(){
  const link = document.getElementById('lockAllLink');
  if(!link) return;
  const anyUnlocked = unlockedTabs.danhmuc || unlockedTabs.kehoach;
  link.style.display = anyUnlocked ? 'inline-flex' : 'none';
}

// Hien modal nhap mat khau de mo khoa 1 tab bao ve. Goi onSuccess() sau khi mo khoa thanh cong.
function promptUnlockTab(tabKey, onSuccess){
  const label = PROTECTED_TAB_LABELS[tabKey] || tabKey;
  const root = document.getElementById('modalRoot');
  root.innerHTML = `
    <div class="modal-overlay" id="unlockOverlay">
      <div class="modal-box">
        <h3><i class="ti ti-lock" style="margin-right:6px;color:#185fa5"></i>Khu vực bảo vệ - ${label}</h3>
        <p>Nhập mật khẩu để truy cập ${label}.</p>
        <input type="password" id="unlockPwInput" placeholder="Mật khẩu" autocomplete="off">
        <div class="modal-err" id="unlockErr">Sai mật khẩu, vui lòng thử lại.</div>
        <div class="btn-row">
          <button id="btnUnlockCancel" style="flex:1">Hủy</button>
          <button class="primary" id="btnUnlockOk" style="flex:1">Mở khóa</button>
        </div>
      </div>
    </div>`;
  const overlay = document.getElementById('unlockOverlay');
  const inp = document.getElementById('unlockPwInput');
  const err = document.getElementById('unlockErr');
  const close = () => { root.innerHTML = ''; };
  document.getElementById('btnUnlockCancel').onclick = close;
  overlay.onclick = e => { if(e.target === overlay) close(); };
  const attempt = async () => {
    const pw = inp.value;
    if(!pw) return;
    err.style.display = 'none';
    const btn = document.getElementById('btnUnlockOk');
    btn.disabled = true; btn.innerHTML = '<span class="spinner" style="margin-right:6px"></span>Đang kiểm tra...';
    try{
      const res = await apiPost({action:'checkAccess', role: tabKey, password: pw});
      if(res && res.ok){
        unlockedTabs[tabKey] = true;
        saveUnlockedTabs();
        updateLockLinkVisibility();
        close();
        onSuccess();
      } else {
        err.style.display = 'block';
        btn.disabled = false; btn.innerHTML = 'Mở khóa';
        inp.value = '';
        inp.focus();
      }
    }catch(e){
      showToast('Lỗi kiểm tra mật khẩu - kiểm tra kết nối mạng', true);
      btn.disabled = false; btn.innerHTML = 'Mở khóa';
    }
  };
  document.getElementById('btnUnlockOk').onclick = attempt;
  inp.addEventListener('keydown', e => { if(e.key === 'Enter'){ e.preventDefault(); attempt(); } });
  setTimeout(()=>inp.focus(), 50);
}

// Chi cho vao 1 tab bao ve neu da mo khoa; neu chua, hien modal xin mat khau truoc,
// chi chay hanh dong vao tab (goVao) sau khi mo khoa thanh cong.
function gateProtectedTab(tabKey, goVao){
  if(isTabUnlocked(tabKey)){ goVao(); return; }
  promptUnlockTab(tabKey, goVao);
}

document.getElementById('lockAllLink').onclick = () => {
  unlockedTabs = {};
  saveUnlockedTabs();
  updateLockLinkVisibility();
  showToast('Đã khóa lại Danh Mục & Kế Hoạch');
  if(currentRole === 'catalog' || currentRole === 'kehoach'){
    switchRole('tron');
  }
};
updateLockLinkVisibility();

document.getElementById('roleTron').onclick = () => {
  switchRole('tron');
  loadCatalogFromServer().then(() => { if(currentRole === 'tron') renderAll(); });
};
document.getElementById('roleKho').onclick = () => {
  switchRole('kho');
};
document.getElementById('roleCapLieu').onclick = () => {
  switchRole('caplieu');
  Promise.all([loadCapLieu(), loadHistory(), loadKeHoach()]).then(() => { if(currentRole === 'caplieu') renderCapLieuApp(); });
};
document.getElementById('roleCatalog').onclick = () => {
  gateProtectedTab('danhmuc', () => {
    switchRole('catalog');
    loadCatalogFromServer().then(() => { if(currentRole === 'catalog') renderCatalogApp(); });
  });
};
document.getElementById('roleKeHoach').onclick = () => {
  gateProtectedTab('kehoach', () => {
    switchRole('kehoach');
    Promise.all([loadCatalogFromServer(), loadHistory(), loadCapLieu(), loadKeHoach()])
      .then(() => { if(currentRole === 'kehoach') renderKeHoachApp(); });
  });
};

async function initialLoad(){
  setConnStatus('loading', 'Đang kiểm tra...');
  await Promise.all([
    loadCatalogFromServer(),
    loadRequests(),
    loadHistory(),
    loadCapLieu(),
    loadKeHoach()
  ]);
  if(activeReqId && tronState.step > 1){
    const stillExists = requests.find(r => r.id === activeReqId);
    if(!stillExists){
      await clearScanState(activeReqId);
      setActiveReqId(null);
      tronState.step = 1;
      saveTronStep();
    } else if(tronState.step === 3){
      scanState = await loadScanState(activeReqId);
    }
  } else if(!activeReqId && tronState.step > 1){
    tronState.step = 1;
    saveTronStep();
  }
  renderAll();
  pollTimer = setInterval(async () => {
    if(currentRole === 'kho'){
      await loadRequests();
      renderAll();
    } else if(currentRole === 'tron' && tronState.step !== 3){
      await loadRequests();
      renderAll();
    } else if(currentRole === 'tron' && tronState.step === 3){
      await loadRequests();
    }
  }, 20000);
}
initialLoad();

</script>
